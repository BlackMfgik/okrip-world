name: OkripWhitelist
version: 1.4.0
main: world.okrip.whitelist.OkripWhitelistPlugin
api-version: '1.21.11'
description: Durable Okrip World whitelist synchronization
commands:
  wlban:
    description: Ban a registered nickname and synchronize access
    permission: okrip.admin
    aliases: [okripban]
    usage: /wlban <nickname> <reason>
  wldel:
    description: Remove a nickname from the whitelist and revoke its site access
    permission: okrip.admin
    usage: /wldel <nickname>
  okripwhitelist:
    description: Validate the OkripWhitelist configuration and delivery journal
    permission: okrip.admin
    usage: /okripwhitelist validate
  wlmenu:
    description: Open the whitelist menu (nickname, Discord, UUID, date added)
    permission: okrip.admin
    aliases: [whitelistmenu, okripwl]
    usage: /wlmenu [nickname, Discord or ID]
permissions:
  okrip.admin:
    default: op
