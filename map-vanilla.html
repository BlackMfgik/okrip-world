<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Креативна Мапа — Okrip World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      try {
        if (localStorage.getItem("theme") === "light")
          document.documentElement.classList.add("light-theme");
      } catch (e) {}
    </script>
    <style>
      .wrap {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <nav class="nav">
        <a href="index.html" class="nav-logo">OKRIP WORLD</a>
        <span class="nav-online">ОНЛАЙН 67</span>
        <div class="theme-toggle" id="theme-toggle">
          <button class="theme-toggle-btn" title="Переключити тему"></button>
        </div>
      </nav>

      <div class="body">
        <div class="maparea">
          <iframe
            id="bluemap-frame"
            src="about:blank"
            title="BlueMap - Креатив"
            allowfullscreen
          ></iframe>

          <div class="map-placeholder" id="placeholder">
            <svg
              width="48"
              height="48"
              viewBox="0 0 48 48"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="4"
                y="4"
                width="40"
                height="40"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
                opacity="0.3"
              />
              <polyline
                points="4,28 14,18 22,24 30,14 44,24"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
              />
              <circle
                cx="34"
                cy="16"
                r="4"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
                opacity="0.3"
              />
            </svg>
            <div class="pulse" id="pulse-dot"></div>
            <span>Завантаження креативної мапи…</span>
          </div>

          <div class="map-error visible" id="map-error">
            МАПА НАРАЗІ НЕДОСТУПНА
          </div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("theme-toggle").addEventListener("click", () => {
        document.documentElement.classList.toggle("light-theme");
        try {
          localStorage.setItem(
            "theme",
            document.documentElement.classList.contains("light-theme")
              ? "light"
              : "dark",
          );
        } catch (e) {}
      });
      document.getElementById("placeholder").style.display = "none";
    </script>
  </body>
</html>
