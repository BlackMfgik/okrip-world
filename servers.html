<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сервери — Okrip World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      try {
        if (localStorage.getItem("theme") === "light")
          document.documentElement.classList.add("light-theme");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="wrap">
      <nav class="nav">
        <a href="index.html" class="nav-logo">OKRIP WORLD</a>
        <span class="nav-online" id="nav-total-online">ОНЛАЙН —</span>
        <div class="theme-toggle" id="theme-toggle">
          <button class="theme-toggle-btn" title="Переключити тему"></button>
        </div>
      </nav>

      <div class="body">
        <div class="servers-wrap">
          <div class="servers-night-bg"></div>
          <div class="servers-day-bg"></div>

          <div class="page-header">
            <div class="page-title">Сервери</div>
          </div>

          <div class="servers-grid">
            <!-- Vanilla -->
            <div class="server-card">
              <div class="server-card-header">
                <div class="server-name">Ваніла</div>
                <div class="server-status">ONLINE</div>
              </div>
              <div class="server-ip-section">
                <div class="ip-row" data-copy="OkripWorld.mcserver.host">
                  <div class="ip-info">
                    <div class="ip-label">IP Адреса</div>
                    <div class="ip-value">OkripWorld.mcserver.host</div>
                  </div>
                  <span class="copy-btn">Копіювати</span>
                </div>
                <div class="ip-row" data-copy="25594">
                  <div class="ip-info">
                    <div class="ip-label">Порт</div>
                    <div class="ip-value">25594</div>
                  </div>
                  <span class="copy-btn">Копіювати</span>
                </div>
              </div>
              <div class="server-card-footer">
                <a href="map-vanilla.html" class="btn-map">Мапа →</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/main.js"></script>
    <script>
      const toast = document.getElementById("toast");
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      }

      document.querySelectorAll(".ip-row").forEach((row) => {
        row.addEventListener("click", async () => {
          const text = row.dataset.copy;
          try {
            await navigator.clipboard.writeText(text);
            showToast("Скопійовано: " + text);
          } catch (e) {
            showToast("Помилка копіювання");
          }
        });
      });
    </script>
  </body>
</html>
